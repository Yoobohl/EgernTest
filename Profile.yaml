    icon: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/icons/Japan.png
- select:
    name: 美国
    flatten: true
    filter: (?i)(🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)
