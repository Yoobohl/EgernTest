    policies:
    - 全部节点
    icon: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/icons/Singapore.png
- select:
    name: 台湾
    flatten: true
    filter: (?i)(🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)
    policies:
    - 全部节点
    icon: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/icons/Taiwan.png
- select:
    name: 低倍率节点
    flatten: true
    filter: (?i)(^(?!.*(?:剩|期)).*(?:(?<!\d)0(\.[0-5]|[*×✕✖⨯⨉x倍]))|(?:[*×✕✖⨯⨉x]0)|^(?!.*(?:客户端|软件)).*下载|低倍|免费|(?<![A-Za-z])free(?![A-Za-z]))
    policies:
    - 全部节点
    icon: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/icons/Available.png
- select:
    name: 高倍率节点
    flatten: true
    filter: (?i)(?:[*×✕✖⨯⨉x](?:[2-9]\d*|[1-9]\d+)(?:\.\d+)?)|(?:(?<![\d.])(?:[2-9]\d*|[1-9]\d+)(?:\.\d+)?(?:倍|[*×✕✖⨯⨉x]))
    policies:
    - 全部节点
    icon: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/icons/Airport.png
- select:
    name: 其他节点
    flatten: true
    filter: (?i)^(?!.*(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong|🇯🇵|日本|东京|大阪|京都|(?<![A-Za-z])JPN?(?![A-Za-z])|japan|🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states|🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore|🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)).*$
    policies:
    - 全部节点
    icon: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/icons/WorldMap.png
