ipv6: false
allow_external_connections: true
vif_only: true
hijack_dns:
- '*'
compat_route: true
proxy_latency_test_url: https://www.apple.com/library/test/success.html
direct_latency_test_url: https://www.apple.com/library/test/success.html
modules:
- name: MyClash Real IP Domains
  url: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/modules/real-ip-domains.yaml
  update_interval: 86400
  enabled: true
- name: Dr.COM 校园网流量
  url: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/modules/drcom-egern/drcom.module.yaml
  update_interval: 86400
  enabled: true
- name: 中国移动（Hark 仪表盘版）
  url: https://cdn.jsdmirror.com/gh/zhaohantao1360-hash/Hark@main/china-mobile-hark-dash.yaml
  update_interval: 86400
  enabled: true
- name: 中国电信小组件
  url: https://cdn.jsdmirror.com/gh/IBL3ND/module@main/ChinaTelecom_Widget.yaml
  update_interval: 86400
  enabled: true
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  proxy_nameservers:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  upstreams:
    china:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    douyin:
    - system
    - 180.184.1.1
    - 180.184.2.2
    foreign:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/rulesets/private.yaml
      update_interval: 86400
      value: system
  - proxy_rule_set:
      match: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/rulesets/douyin.yaml
      update_interval: 86400
      value: douyin
  - proxy_rule_set:
      match: https://cdn.jsdmirror.com/gh/Yoobohl/EgernTest@main/rulesets/cn.yaml
      update_interval: 86400
      value: china
  - domain_wildcard:
      match: '*'
      value: foreign
  hosts:
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    services.googleapis.cn: services.googleapis.com
    mcdn.bilivideo.com:
    - 0.0.0.0
    '*.mcdn.bilivideo.com':
    - 0.0.0.0
    mcdn.bilivideo.cn:
    - 0.0.0.0
    '*.mcdn.bilivideo.cn':
    - 0.0.0.0
    edge.mountaintoys.cn:
    - 0.0.0.0
    '*.edge.mountaintoys.cn':
    - 0.0.0.0
    h2.smtcdns.net:
    - 0.0.0.0
    '*.h2.smtcdns.net':
    - 0.0.0.0
proxies: []
default_proxy_group: 全部节点
rules:
- domain:
    match: cloudflare-dns.com
    policy: 默认代理
- domain:
    match: dns.google
    policy: 默认代理
- ip_cidr:
    match: 1.1.1.1/32
    no_resolve: true
    policy: 默认代理
- ip_cidr:
    match: 1.0.0.1/32
    no_resolve: true
    policy: 默认代理
- ip_cidr:
    match: 8.8.8.8/32
